# ============================================================
# Profile
# ============================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ============================================================
# Server
# ============================================================
# Render assigns PORT (usually 10000) — fall back to 8080 for local dev
server.port=${PORT:8080}

# ============================================================
# Database
# ============================================================
# Local default: localhost Postgres. Render/Docker overrides via env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/optomeapi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2001}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari — tuned for Neon's scale-to-zero (serverless Postgres)
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# NOTE: removed explicit dialect — Hibernate 6 auto-detects from JDBC connection
#       (the HHH90000025 warning was caused by hardcoding this)

# ============================================================
# JWT
# ============================================================
# Use one consistent key across code: pick jwt.secret OR app.jwt.secret — see note below
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-in-production-must-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# File Upload
# ============================================================
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# ============================================================
# Logging
# ============================================================
logging.level.org.springframework.security=${LOG_SECURITY_LEVEL:INFO}
logging.level.org.hibernate.SQL=${LOG_SQL_LEVEL:INFO}