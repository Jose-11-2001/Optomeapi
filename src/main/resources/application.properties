# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/optomeapi
spring.datasource.username=postgres
spring.datasource.password=2001
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=your-super-secret-jwt-key-change-in-production-must-be-at-least-256-bits-long
jwt.expiration=86400000

# File Upload
file.upload-dir=./uploads

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# application.properties — safe defaults for local dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# defaults; overridden by env in Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/optomeapi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# JWT
app.jwt.secret=${JWT_SECRET:dev-secret-not-for-production-use-only}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}