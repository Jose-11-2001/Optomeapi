version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: optomeapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: optomeapi
      POSTGRES_USER: optomeapi
      POSTGRES_PASSWORD: optomeapi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - optomeapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optomeapi -d optomeapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optomeapi-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # --- Spring overrides ---
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/optomeapi
      SPRING_DATASOURCE_USERNAME: optomeapi
      SPRING_DATASOURCE_PASSWORD: optomeapi_dev_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      # --- JWT (replace with a strong secret!) ---
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-bytes
      JWT_EXPIRATION_MS: "86400000"

volumes:
  optomeapi_pgdata: